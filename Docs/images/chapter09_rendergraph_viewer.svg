<svg width="960" height="420" viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" font-family="Yu Gothic, Meiryo, sans-serif">
  <rect x="0" y="0" width="960" height="420" fill="#ffffff"/>

  <!-- タイトル -->
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Render Graph の概念図（Outline08 の読み書き）</text>
  <text x="480" y="52" text-anchor="middle" font-size="12" fill="#555">横：実行順のパス ／ 縦：リソース　R = 読む　W = 書く</text>

  <!-- 列ヘッダ（パス） -->
  <rect x="330" y="70" width="230" height="54" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="445" y="93" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">パス1：Outline08</text>
  <text x="445" y="111" text-anchor="middle" font-size="11" fill="#1565c0">輪郭線を描画</text>

  <rect x="600" y="70" width="230" height="54" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="715" y="93" text-anchor="middle" font-size="15" font-weight="bold" fill="#e65100">パス2：Outline08 Copy</text>
  <text x="715" y="111" text-anchor="middle" font-size="11" fill="#ef6c00">結果を書き戻す</text>

  <!-- 実行順の矢印 -->
  <line x1="560" y1="97" x2="598" y2="97" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555"/>
    </marker>
  </defs>

  <!-- 行：リソース -->
  <!-- Camera Color -->
  <rect x="40" y="150" width="260" height="60" rx="6" fill="#f5f5f5" stroke="#9e9e9e"/>
  <text x="170" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Camera Color（source）</text>
  <text x="170" y="195" text-anchor="middle" font-size="11" fill="#666">カメラの描画結果・全体で使用</text>

  <!-- Depth -->
  <rect x="40" y="225" width="260" height="60" rx="6" fill="#f5f5f5" stroke="#9e9e9e"/>
  <text x="170" y="251" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Depth（cameraDepthTexture）</text>
  <text x="170" y="270" text-anchor="middle" font-size="11" fill="#666">輪郭の判定に使う深度</text>

  <!-- _OutlineTemp -->
  <rect x="40" y="300" width="260" height="60" rx="6" fill="#f5f5f5" stroke="#9e9e9e"/>
  <text x="170" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">_OutlineTemp（temp）</text>
  <text x="170" y="345" text-anchor="middle" font-size="11" fill="#666">一時テクスチャ・パス間だけ生存</text>

  <!-- セル：パス1 列（x 330〜560） -->
  <!-- Camera Color: R -->
  <rect x="330" y="150" width="230" height="60" rx="6" fill="#bbdefb" stroke="#1976d2"/>
  <text x="445" y="186" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d47a1">R（読む）</text>
  <!-- Depth: R -->
  <rect x="330" y="225" width="230" height="60" rx="6" fill="#bbdefb" stroke="#1976d2"/>
  <text x="445" y="261" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d47a1">R（読む）</text>
  <!-- _OutlineTemp: W -->
  <rect x="330" y="300" width="230" height="60" rx="6" fill="#ffcc80" stroke="#f57c00"/>
  <text x="445" y="336" text-anchor="middle" font-size="16" font-weight="bold" fill="#e65100">W（書く）</text>

  <!-- セル：パス2 列（x 600〜830） -->
  <!-- Camera Color: W -->
  <rect x="600" y="150" width="230" height="60" rx="6" fill="#ffcc80" stroke="#f57c00"/>
  <text x="715" y="186" text-anchor="middle" font-size="16" font-weight="bold" fill="#e65100">W（書き戻す）</text>
  <!-- Depth: 未使用 -->
  <rect x="600" y="225" width="230" height="60" rx="6" fill="#fafafa" stroke="#e0e0e0" stroke-dasharray="4 3"/>
  <text x="715" y="261" text-anchor="middle" font-size="13" fill="#9e9e9e">―（使わない）</text>
  <!-- _OutlineTemp: R -->
  <rect x="600" y="300" width="230" height="60" rx="6" fill="#bbdefb" stroke="#1976d2"/>
  <text x="715" y="336" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d47a1">R（読む）</text>

  <!-- 注釈 -->
  <text x="40" y="390" font-size="12" fill="#333">・Camera Color は両パスに関わるため寿命が最も長い</text>
  <text x="40" y="408" font-size="12" fill="#333">・_OutlineTemp は W から R までの間だけ生存し、その後メモリを再利用できる</text>
</svg>